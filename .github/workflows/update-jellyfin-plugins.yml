name: "Update Jellyfin plugin pins"

on:
  schedule:
    - cron: "0 4 * * 6" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-jellyfin-plugins
  cancel-in-progress: false

jobs:
  update:
    name: "Refresh pins"
    runs-on: ubuntu-latest
    env:
      AUTO_TOKEN: ${{ secrets.WORKFLOW_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check automation token
        if: env.AUTO_TOKEN == ''
        run: |
          echo "::warning::WORKFLOW_GITHUB_TOKEN secret is not set; skipping the Jellyfin pins update."

      - name: Refresh pins
        id: pins
        if: env.AUTO_TOKEN != ''
        run: ./ci/update-jellyfin-pins.sh

      - name: Show diff
        if: steps.pins.outputs.changed == 'true'
        run: git --no-pager diff

      - name: Create pull request
        id: pr
        if: steps.pins.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WORKFLOW_GITHUB_TOKEN }}
          branch: chore/jellyfin-plugin-pins
          delete-branch: true
          title: "auto(rpi5): update Jellyfin plugin pins"
          commit-message: "auto(rpi5): update Jellyfin plugin pins"
          body: |
            Auto-generated by `ci/update-jellyfin-pins.sh`.

      - name: Auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_GITHUB_TOKEN }}
        run: |
          nr="${{ steps.pr.outputs.pull-request-number }}"
          repo="${{ github.repository }}"
          if gh pr merge --squash --auto --delete-branch "$nr" --repo "$repo"; then
            echo "auto-merge queued for #$nr; merging once the build CI passes"
          else
            # Repo auto-merge may be disabled (repo-level setting); merge directly.
            gh pr merge --squash --delete-branch "$nr" --repo "$repo"
          fi
